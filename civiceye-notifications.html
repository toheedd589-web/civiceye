<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CivicEye — Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     SHARED SHELL CSS — inlined so this file works standalone in
     any preview or hosting environment (no external assets/ folder
     required). Canonical source: assets/shell.css in the full project.
  ============================================================ */
/* ==============================================================
   CivicEye — Shared Design Tokens + App Shell
   Single source of truth for every citizen-module page.
   Loaded AFTER Tailwind CDN and the Google Font link, BEFORE any
   page-specific <style> block, on every page in the module.
============================================================== */

/* ---------- 1. DESIGN TOKENS ----------
   Canonical names used by every page built from Turn 2 onward
   (My Complaints, Complaint Details, Notifications, Profile,
   Settings, Dashboard). Report Issue was authored slightly
   earlier and references --ce-sub / --ce-line instead of
   --ce-ink-soft / --ce-border — both are defined here so every
   existing page keeps working without being rewritten. */
:root{
  --ce-ink:#0B1220;
  --ce-ink-soft:#475569;
  --ce-emerald:#0E9F6E;
  --ce-emerald-dark:#0C8A5F;
  --ce-emerald-tint:#ECFDF5;
  --ce-surface:#F8FAFC;
  --ce-border:#E5E9F0;

  /* Bridged aliases for the Report Issue page's original token names */
  --ce-sub: var(--ce-ink-soft);
  --ce-line: var(--ce-border);
  --ce-amber:#D97706;
  --ce-red:#DC2626;
}

* { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
body { background: var(--ce-surface); color: var(--ce-ink); }

.ce-scroll-x { -ms-overflow-style: none; scrollbar-width: none; }
.ce-scroll-x::-webkit-scrollbar { display: none; }

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--ce-emerald);
  outline-offset: 2px;
  border-radius: 8px;
}

/* ---------- 2. SHARED ANIMATION / COMPONENT UTILITIES ----------
   Previously duplicated verbatim across every page's own <style>
   block. Consolidated here; each page's local styles now only
   contain what is genuinely unique to that page. */
@keyframes ce-fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ce-fade-up { animation: ce-fade-up 480ms cubic-bezier(0.16,1,0.3,1) both; }

.ce-hover-card {
  transition: transform 260ms cubic-bezier(0.16,1,0.3,1), box-shadow 260ms ease, border-color 260ms ease;
}
.ce-hover-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 32px -14px rgba(15,23,42,0.16);
  border-color: rgba(15,23,42,0.10);
}

.ce-cta {
  background: var(--ce-emerald);
  box-shadow: 0 1px 2px rgba(14,159,110,0.25), 0 8px 20px -8px rgba(14,159,110,0.55);
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1), background-color 220ms ease, box-shadow 220ms ease;
}
.ce-cta:hover { background: var(--ce-emerald-dark); transform: scale(1.03); }
.ce-cta:active { transform: scale(0.98); }
.ce-cta:disabled { opacity: 0.7; transform: none; cursor: default; }

.ce-ghost-btn { transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease; }
.ce-ghost-btn:hover { background-color: rgba(15,23,42,0.045); }

.ce-rippleable { position: relative; overflow: hidden; }
.ce-ripple {
  position: absolute; border-radius: 9999px;
  background: rgba(11,18,32,0.12);
  transform: scale(0);
  animation: ce-ripple-anim 620ms ease-out;
  pointer-events: none;
}
.ce-rippleable.ce-ripple-light .ce-ripple { background: rgba(255,255,255,0.5); }
@keyframes ce-ripple-anim { to { transform: scale(2.6); opacity: 0; } }

@keyframes ce-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.ce-skeleton {
  background: linear-gradient(90deg, #EDF1F6 25%, #F6F8FA 37%, #EDF1F6 63%);
  background-size: 200% 100%;
  animation: ce-shimmer 1.4s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* ==============================================================
   3. APP SHELL — header, sidebar, breadcrumb, page loader
   These are new in this build: the pieces that make every page
   behave like one connected application.
============================================================== */

/* ---------- Page loading overlay ---------- */
.ce-page-loader {
  position: fixed; inset: 0; z-index: 100;
  background: var(--ce-surface);
  display: flex; align-items: center; justify-content: center;
  opacity: 1; visibility: visible;
  transition: opacity 380ms ease, visibility 0s linear 0s;
}
.ce-page-loader.is-hidden {
  opacity: 0; visibility: hidden;
  transition: opacity 380ms ease, visibility 0s linear 380ms;
}
.ce-loader-badge {
  height: 52px; width: 52px; border-radius: 16px;
  background: var(--ce-ink);
  display: flex; align-items: center; justify-content: center;
  animation: ce-loader-pulse 1.1s ease-in-out infinite;
}
@keyframes ce-loader-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
}

/* ---------- Sticky shared header ---------- */
.ce-shell-header {
  position: sticky; top: 0; z-index: 40;
  background-color: rgba(255,255,255,0.9);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--ce-border);
}

/* ---------- Sidebar nav item ---------- */
.ce-shell-nav-item {
  transition: background-color 200ms ease, color 200ms ease, transform 180ms ease;
}
.ce-shell-nav-item:active { transform: scale(0.98); }
.ce-shell-nav-item[aria-current="page"] {
  background-color: var(--ce-ink);
  color: white;
}
.ce-shell-nav-item[aria-current="page"] svg { stroke: white; }

/* ---------- Off-canvas sidebar (mobile/tablet) ---------- */
.ce-shell-sidebar {
  transform: translateX(-100%);
  transition: transform 380ms cubic-bezier(0.16,1,0.3,1);
}
.ce-shell-sidebar.is-open { transform: translateX(0); }
@media (min-width: 1024px) {
  .ce-shell-sidebar {
    transform: none !important;
    position: static; box-shadow: none;
    width: auto; height: auto; z-index: auto;
    background: transparent; border: 0;
  }
}
.ce-shell-sidebar-backdrop {
  position: fixed; inset: 0; z-index: 45;
  background: rgba(11,18,32,0.4);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity 320ms ease;
}
.ce-shell-sidebar-backdrop.is-open { opacity: 1; pointer-events: auto; }

/* ---------- Floating-only sidebar variant ----------
   For pages (like Settings) that already have their own in-page
   sub-navigation — the app sidebar stays an off-canvas drawer
   even on desktop, instead of also claiming a static column. */
@media (min-width: 1024px) {
  .ce-shell-sidebar.ce-shell-sidebar--floating {
    position: fixed; top: 0; left: 0; z-index: 50;
    transform: translateX(-100%);
    width: 320px; height: 100%;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    background: white; border-right: 1px solid var(--ce-border);
  }
  .ce-shell-sidebar.ce-shell-sidebar--floating.is-open { transform: translateX(0); }
}

/* ---------- Profile menu dropdown ---------- */
.ce-shell-profile-menu {
  opacity: 0; pointer-events: none; transform: translateY(6px) scale(0.98);
  transition: opacity 200ms ease, transform 200ms cubic-bezier(0.16,1,0.3,1);
}
.ce-shell-profile-menu.is-open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

/* ---------- Breadcrumb ---------- */
.ce-shell-breadcrumb a { transition: color 180ms ease; }
.ce-shell-breadcrumb a:hover { color: var(--ce-ink); }

/* ---------- Main content fade/slide on arrival ---------- */
.ce-shell-content { transition: opacity 280ms ease, transform 280ms cubic-bezier(0.16,1,0.3,1); }
.ce-shell-content.is-leaving { opacity: 0; transform: translateY(8px); }

</style>

<style>
  /* ==========================================================
     PAGE-SPECIFIC STYLES ONLY — tokens, fade-up, scroll-x, cta,
     ghost-btn, skeleton, and focus states now live in
     assets/shell.css.
  ========================================================== */

  /* ---------- Notification card ---------- */
  .ce-notif-card {
    transition: transform 260ms cubic-bezier(0.16,1,0.3,1), box-shadow 260ms ease, border-color 260ms ease, background-color 320ms ease;
  }
  .ce-notif-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px -14px rgba(15,23,42,0.16);
    border-color: rgba(15,23,42,0.10);
  }
  .ce-notif-card.is-unread {
    background-color: #FBFEFC;
    border-color: rgba(14,159,110,0.28);
  }

  /* Brief highlight pulse when a card is freshly marked read */
  @keyframes ce-highlight-fade {
    0%   { background-color: var(--ce-emerald-tint); }
    100% { background-color: transparent; }
  }
  .ce-just-read { animation: ce-highlight-fade 900ms ease-out; }

  .ce-unread-dot {
    box-shadow: 0 0 0 3px rgba(14,159,110,0.15);
  }

  /* ---------- Chips ---------- */
  .ce-chip {
    transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, transform 180ms ease;
  }
  .ce-chip:active { transform: scale(0.96); }
  .ce-chip[aria-pressed="true"] {
    background-color: var(--ce-ink);
    color: white;
    border-color: var(--ce-ink);
    box-shadow: 0 6px 16px -6px rgba(11,18,32,0.35);
  }
  .ce-chip .ce-chip-count {
    transition: background-color 220ms ease, color 220ms ease;
  }

  .ce-ghost-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .ce-ghost-btn:disabled:hover { background-color: transparent; }

  /* ---------- Filter transition wrapper ---------- */
  #ce-notification-list {
    transition: opacity 220ms ease;
  }
  #ce-notification-list.is-transitioning { opacity: 0; }
</style>
</head>
<body>

<!-- Shell mounts: header + sidebar are rendered by assets/shell.js -->
<div class="lg:flex lg:items-start lg:gap-6 lg:max-w-[1500px] lg:mx-auto lg:px-5 lg:pt-6">
  <div id="ce-shell-sidebar-mount"></div>

  <div class="flex-1 min-w-0">
    <div id="ce-shell-header-mount"></div>

<main id="ce-shell-content" class="ce-shell-content max-w-4xl mx-auto px-5 md:px-8 py-8 md:py-10">

  <div id="ce-shell-breadcrumb-mount"></div>

  <!-- =========================================================
       PAGE HEADER
  ========================================================== -->
  <header class="ce-fade-up flex flex-col gap-5 mb-7">
    <div class="flex items-start gap-4">
      <button
        id="ce-back-btn"
        type="button"
        aria-label="Go back"
        class="ce-ghost-btn shrink-0 h-10 w-10 md:h-11 md:w-11 flex items-center justify-center rounded-full border border-[var(--ce-border)] bg-white"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12l7 7" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2.5 flex-wrap">
          <h1 class="text-[22px] md:text-[26px] font-extrabold tracking-tight text-[var(--ce-ink)]">Notifications</h1>
          <span id="ce-unread-pill" class="ce-badge-count inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 rounded-full bg-[var(--ce-emerald)] text-white text-[11.5px] font-bold">0</span>
        </div>
        <p class="text-[13.5px] md:text-[14.5px] text-[var(--ce-ink-soft)] mt-0.5">Stay updated with your complaint activity.</p>
      </div>

      <button
        id="ce-mark-all-btn"
        type="button"
        class="ce-ghost-btn shrink-0 inline-flex items-center gap-1.5 h-10 md:h-11 px-3.5 md:px-4 rounded-xl border border-[var(--ce-border)] bg-white text-[13px] md:text-[14px] font-semibold text-[var(--ce-ink)]"
      >
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l4 4L18 6.5" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 16.5L20 5.5" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/></svg>
        <span class="hidden sm:inline">Mark All as Read</span>
        <span class="sm:hidden">Mark all</span>
      </button>
    </div>

    <!-- Search -->
    <label for="ce-search" class="sr-only">Search notifications</label>
    <div class="relative w-full">
      <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="#94A3B8" stroke-width="2"/>
        <path d="M20 20l-3.5-3.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        id="ce-search"
        type="search"
        placeholder="Search notifications…"
        class="w-full h-11 pl-10 pr-4 rounded-xl border border-[var(--ce-border)] bg-white text-[14px] placeholder:text-slate-400 focus:border-[var(--ce-emerald)] transition-colors"
      />
    </div>
  </header>

  <!-- =========================================================
       FILTER CHIPS
  ========================================================== -->
  <div
    id="ce-chip-row"
    class="ce-fade-up ce-scroll-x flex items-center gap-2 overflow-x-auto pb-1 mb-6"
    role="group"
    aria-label="Filter notifications"
  >
    <!-- rendered by JS -->
  </div>

  <!-- =========================================================
       NOTIFICATION LIST
  ========================================================== -->
  <section aria-label="Your notifications">
    <div class="flex items-center justify-between mb-3">
      <p id="ce-results-count" class="text-[13.5px] text-[var(--ce-ink-soft)]" aria-live="polite"></p>
    </div>

    <div id="ce-notification-list" class="flex flex-col gap-3">
      <!-- populated by JS: skeleton → cards → empty state -->
    </div>
  </section>

</main>
  </div>
</div>

<!-- ============================================================
     SHELL BOOTSTRAP — shared header, sidebar, breadcrumb, transitions
============================================================= -->
<script>
  /* ============================================================
     SHARED SHELL JS — inlined so this file works standalone in
     any preview or hosting environment. Canonical source:
     assets/shell.js in the full project.
  ============================================================ */
/* ==============================================================
   CivicEye — Shared App Shell (JavaScript)
   One reusable navigation system for every citizen-module page.
   Each page calls CivicEyeShell.init({ activeKey, breadcrumb })
   in a small bootstrap <script> right after <body> opens.
============================================================== */
(function () {
  'use strict';

  /* ----------------------------------------------------------
     1. SITE MAP — single source of truth for nav + routing
  ---------------------------------------------------------- */
  var PAGES = {
    dashboard:     { label: 'Dashboard',     href: 'civiceye-dashboard.html',
      icon: '<rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/>' },
    'report-issue':{ label: 'Report Issue',  href: 'civiceye-report-issue.html',
      icon: '<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' },
    'my-complaints': { label: 'My Complaints', href: 'civiceye-my-complaints.html',
      icon: '<path d="M6 4h9l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' },
    notifications: { label: 'Notifications', href: 'civiceye-notifications.html',
      icon: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' },
    profile:       { label: 'Profile',       href: 'civiceye-profile.html',
      icon: '<circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' },
    settings:      { label: 'Settings',      href: 'civiceye-settings.html',
      icon: '<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.6-2-3.4-2.4.8a7.9 7.9 0 0 0-2.6-1.5L14 2h-4l-.4 2.8a7.9 7.9 0 0 0-2.6 1.5l-2.4-.8-2 3.4 2 1.6a7.9 7.9 0 0 0 0 3l-2 1.6 2 3.4 2.4-.8a7.9 7.9 0 0 0 2.6 1.5L10 22h4l.4-2.8a7.9 7.9 0 0 0 2.6-1.5l2.4.8 2-3.4-2-1.6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' },
    /* Reachable but not a primary sidebar item — it's a detail/child page */
    'complaint-details': { label: 'Complaint Details', href: 'civiceye-complaint-details.html', icon: '' }
  };

  /* Sidebar shows these, in this order (complaint-details is intentionally excluded) */
  var SIDEBAR_ORDER = ['dashboard', 'report-issue', 'my-complaints', 'notifications', 'profile', 'settings'];

  var DUMMY_UNREAD_COUNT = 4; // mirrors the seed data on the Notifications page

  /* ----------------------------------------------------------
     2. DOM BOOTSTRAP HELPERS
  ---------------------------------------------------------- */
  function el(html) {
    var wrap = document.createElement('div');
    wrap.innerHTML = html.trim();
    return wrap.firstElementChild;
  }

  /* ----------------------------------------------------------
     3. PAGE LOADER (shown briefly on arrival, and again on
        navigation before leaving the page)
  ---------------------------------------------------------- */
  function mountLoader() {
    var existing = document.getElementById('ce-page-loader');
    if (existing) return existing;
    var loader = el(
      '<div id="ce-page-loader" class="ce-page-loader" aria-hidden="true">' +
        '<div class="flex flex-col items-center gap-3.5">' +
          '<span class="ce-loader-badge">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
              '<path d="M1.5 12C3.7 7.2 7.5 4.7 12 4.7c4.5 0 8.3 2.5 10.5 7.3-2.2 4.8-6 7.3-10.5 7.3-4.5 0-8.3-2.5-10.5-7.3Z" stroke="#ECFDF5" stroke-width="1.6" stroke-linejoin="round"/>' +
              '<circle cx="12" cy="12" r="3.1" fill="#0E9F6E"/>' +
            '</svg>' +
          '</span>' +
          '<span class="text-[12.5px] font-semibold text-[var(--ce-ink-soft)]">Loading…</span>' +
        '</div>' +
      '</div>'
    );
    document.body.insertBefore(loader, document.body.firstChild);
    return loader;
  }

  function hideLoader() {
    var loader = document.getElementById('ce-page-loader');
    if (!loader) return;
    // Small delay so the loader is never a single-frame flash
    window.setTimeout(function () { loader.classList.add('is-hidden'); }, 220);
  }

  /* Navigate with a brief loading overlay — the shared "page transition" */
  function navigate(href) {
    if (!href) return;
    var loader = document.getElementById('ce-page-loader');
    var content = document.getElementById('ce-shell-content');
    if (content) content.classList.add('is-leaving');
    if (loader) loader.classList.remove('is-hidden');
    window.setTimeout(function () { window.location.href = href; }, 260);
  }

  /* ----------------------------------------------------------
     4. SHARED HEADER
  ---------------------------------------------------------- */
  function renderHeader(activeKey, sidebarMode) {
    var mount = document.getElementById('ce-shell-header-mount');
    if (!mount) return;
    var toggleVisibilityClass = sidebarMode === 'floating' ? '' : 'lg:hidden';

    var header = el(
      '<header class="ce-shell-header">' +
        '<div class="max-w-[1400px] mx-auto px-5 md:px-8 h-16 md:h-[68px] flex items-center justify-between gap-3">' +

          '<div class="flex items-center gap-2.5 min-w-0">' +
            '<button type="button" id="ce-shell-sidebar-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="ce-shell-sidebar" class="ce-ghost-btn ' + toggleVisibilityClass + ' h-10 w-10 shrink-0 rounded-full border border-[var(--ce-border)] bg-white flex items-center justify-center">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="#0B1220" stroke-width="2" stroke-linecap="round"/></svg>' +
            '</button>' +
            '<button type="button" class="ce-shell-logo-btn flex items-center gap-2 shrink-0" data-ce-href="' + PAGES.dashboard.href + '" aria-label="CivicEye — dashboard">' +
              '<span class="h-8 w-8 rounded-lg bg-[var(--ce-ink)] flex items-center justify-center">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M1.5 12C3.7 7.2 7.5 4.7 12 4.7c4.5 0 8.3 2.5 10.5 7.3-2.2 4.8-6 7.3-10.5 7.3-4.5 0-8.3-2.5-10.5-7.3Z" stroke="#ECFDF5" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.1" fill="#0E9F6E"/></svg>' +
              '</span>' +
              '<span class="hidden sm:block text-[15px] font-extrabold tracking-tight text-[var(--ce-ink)]">Civic<span class="text-[var(--ce-emerald)]">Eye</span></span>' +
            '</button>' +
          '</div>' +

          '<div class="hidden md:block flex-1 max-w-xs">' +
            '<label for="ce-shell-search" class="sr-only">Search complaints</label>' +
            '<div class="relative">' +
              '<svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="#94A3B8" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/></svg>' +
              '<input id="ce-shell-search" type="search" placeholder="Search complaints…" class="w-full h-9 pl-9 pr-3 rounded-lg border border-[var(--ce-border)] bg-white text-[13px] placeholder:text-slate-400 focus:border-[var(--ce-emerald)] transition-colors" />' +
            '</div>' +
          '</div>' +

          '<div class="flex items-center gap-2 shrink-0">' +
            '<button type="button" class="ce-shell-notif-btn ce-ghost-btn relative h-10 w-10 rounded-full border border-[var(--ce-border)] bg-white flex items-center justify-center" data-ce-href="' + PAGES.notifications.href + '" aria-label="Notifications">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z" stroke="#0B1220" stroke-width="2" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="#0B1220" stroke-width="2" stroke-linecap="round"/></svg>' +
              (DUMMY_UNREAD_COUNT > 0 ? '<span class="absolute top-1.5 right-1.5 h-2 w-2 rounded-full bg-red-500"></span>' : '') +
            '</button>' +

            '<div class="relative">' +
              '<button type="button" id="ce-shell-profile-btn" aria-haspopup="true" aria-expanded="false" class="ce-ghost-btn h-10 px-1.5 rounded-full border border-[var(--ce-border)] bg-white flex items-center gap-1">' +
                '<span class="h-7 w-7 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-[11px] font-bold">AS</span>' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
              '</button>' +
              '<div id="ce-shell-profile-menu" role="menu" aria-label="Profile menu" class="ce-shell-profile-menu absolute right-0 mt-2 w-48 rounded-xl border border-[var(--ce-border)] bg-white shadow-xl p-1.5 z-50">' +
                '<button type="button" role="menuitem" class="w-full text-left px-3 py-2 rounded-lg text-[13.5px] font-medium text-[var(--ce-ink)] hover:bg-slate-50" data-ce-href="' + PAGES.profile.href + '">My Profile</button>' +
                '<button type="button" role="menuitem" class="w-full text-left px-3 py-2 rounded-lg text-[13.5px] font-medium text-[var(--ce-ink)] hover:bg-slate-50" data-ce-href="' + PAGES.settings.href + '">Settings</button>' +
                '<div class="h-px bg-[var(--ce-border)] my-1"></div>' +
                '<button type="button" role="menuitem" class="w-full text-left px-3 py-2 rounded-lg text-[13.5px] font-semibold text-red-600 hover:bg-red-50" id="ce-shell-logout-btn">Log Out</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</header>'
    );

    mount.replaceWith(header);

    /* Search: dummy — routes to My Complaints with the query preserved */
    var searchInput = header.querySelector('#ce-shell-search');
    if (searchInput) {
      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && searchInput.value.trim()) {
          navigate(PAGES['my-complaints'].href + '?search=' + encodeURIComponent(searchInput.value.trim()));
        }
      });
    }

    /* Profile dropdown */
    var profileBtn = header.querySelector('#ce-shell-profile-btn');
    var profileMenu = header.querySelector('#ce-shell-profile-menu');
    function closeProfileMenu() {
      profileMenu.classList.remove('is-open');
      profileBtn.setAttribute('aria-expanded', 'false');
    }
    profileBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var isOpen = profileMenu.classList.toggle('is-open');
      profileBtn.setAttribute('aria-expanded', String(isOpen));
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('#ce-shell-profile-menu') && !e.target.closest('#ce-shell-profile-btn')) closeProfileMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeProfileMenu();
    });

    /* Logout — no real session in this frontend-only build */
    var logoutBtn = header.querySelector('#ce-shell-logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function () {
        // No auth/backend in this build — dummy action only.
        closeProfileMenu();
      });
    }
  }

  /* ----------------------------------------------------------
     5. SHARED SIDEBAR
  ---------------------------------------------------------- */
  function renderSidebar(activeKey, sidebarMode) {
    var mount = document.getElementById('ce-shell-sidebar-mount');
    if (!mount) return;

    var navItemsHtml = SIDEBAR_ORDER.map(function (key) {
      var page = PAGES[key];
      var isActive = key === activeKey;
      return '' +
        '<button type="button" class="ce-shell-nav-item ce-rippleable w-full flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-[13.5px] font-semibold text-[var(--ce-ink)] text-left" ' +
        'data-ce-href="' + page.href + '"' + (isActive ? ' aria-current="page"' : '') + '>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor">' + page.icon + '</svg>' +
          page.label +
        '</button>';
    }).join('');

    var isFloating = sidebarMode === 'floating';
    var desktopClasses = isFloating ? '' : ' lg:static lg:z-auto lg:w-[220px] lg:shrink-0 lg:p-0 lg:sticky lg:top-6 lg:h-auto';
    var floatingClass = isFloating ? ' ce-shell-sidebar--floating' : '';

    var backdrop = el('<div id="ce-shell-sidebar-backdrop" class="ce-shell-sidebar-backdrop' + (isFloating ? '' : ' lg:hidden') + '"></div>');
    var sidebar = el(
      '<aside id="ce-shell-sidebar" class="ce-shell-sidebar' + floatingClass + ' fixed top-0 left-0 z-50 h-full w-[78%] max-w-xs overflow-y-auto bg-white p-4 flex flex-col gap-1.5' + desktopClasses + '" aria-label="Primary navigation">' +
        '<div class="flex items-center justify-between mb-2' + (isFloating ? '' : ' lg:hidden') + '">' +
          '<span class="text-[15px] font-extrabold tracking-tight text-[var(--ce-ink)]">Civic<span class="text-[var(--ce-emerald)]">Eye</span></span>' +
          '<button type="button" id="ce-shell-sidebar-close" aria-label="Close menu" class="ce-ghost-btn h-9 w-9 rounded-full flex items-center justify-center border border-[var(--ce-border)]">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="#0B1220" stroke-width="2" stroke-linecap="round"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="lg:rounded-2xl lg:border lg:border-[var(--ce-border)] lg:bg-white lg:p-2.5 flex flex-col gap-1">' +
          navItemsHtml +
        '</div>' +
      '</aside>'
    );

    mount.replaceWith(sidebar);
    document.body.appendChild(backdrop);

    var toggleBtn = document.getElementById('ce-shell-sidebar-toggle');
    var closeBtn = sidebar.querySelector('#ce-shell-sidebar-close');

    function openSidebar() {
      sidebar.classList.add('is-open');
      backdrop.classList.add('is-open');
      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }
    function closeSidebar() {
      sidebar.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      if (toggleBtn) toggleBtn.focus();
    }
    if (toggleBtn) toggleBtn.addEventListener('click', openSidebar);
    closeBtn.addEventListener('click', closeSidebar);
    backdrop.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sidebar.classList.contains('is-open')) closeSidebar();
    });
    window.addEventListener('resize', function () {
      if (!isFloating && window.innerWidth >= 1024 && sidebar.classList.contains('is-open')) closeSidebar();
    });

    /* Close the mobile sidebar automatically when a nav item is chosen */
    sidebar.addEventListener('click', function (e) {
      if (e.target.closest('[data-ce-href]')) closeSidebar();
    });
  }

  /* ----------------------------------------------------------
     6. BREADCRUMB
  ---------------------------------------------------------- */
  function renderBreadcrumb(trail) {
    var mount = document.getElementById('ce-shell-breadcrumb-mount');
    if (!mount || !trail || !trail.length) return;

    var html = trail.map(function (crumb, i) {
      var isLast = i === trail.length - 1;
      var sep = i > 0 ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="mx-1 shrink-0"><path d="M9 6l6 6-6 6" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
      if (isLast || !crumb.href) {
        return sep + '<span class="text-[12.5px] font-semibold text-[var(--ce-ink)]" aria-current="page">' + crumb.label + '</span>';
      }
      return sep + '<button type="button" class="text-[12.5px] font-medium text-[var(--ce-ink-soft)]" data-ce-href="' + crumb.href + '">' + crumb.label + '</button>';
    }).join('');

    var nav = el('<nav aria-label="Breadcrumb" class="ce-shell-breadcrumb flex items-center flex-wrap mb-4">' + html + '</nav>');
    mount.replaceWith(nav);
  }

  /* ----------------------------------------------------------
     7. GLOBAL NAVIGATION WIRING
     Any element with data-ce-href routes through the shared
     transition instead of a plain, jarring page-jump.
  ---------------------------------------------------------- */
  function wireNavigation() {
    document.addEventListener('click', function (e) {
      var trigger = e.target.closest('[data-ce-href]');
      if (!trigger) return;
      e.preventDefault();
      navigate(trigger.getAttribute('data-ce-href'));
    });
  }

  /* ----------------------------------------------------------
     8. PUBLIC API
  ---------------------------------------------------------- */
  window.CivicEyeShell = {
    PAGES: PAGES,
    navigate: navigate,
    init: function (config) {
      config = config || {};
      mountLoader();
      renderHeader(config.activeKey, config.sidebarMode);
      renderSidebar(config.activeKey, config.sidebarMode);
      renderBreadcrumb(config.breadcrumb);
      wireNavigation();

      /* Pre-fill the shared search box if we arrived via a search link */
      var params = new URLSearchParams(window.location.search);
      var searchTerm = params.get('search');
      var searchBox = document.getElementById('ce-shell-search');
      if (searchTerm && searchBox) searchBox.value = searchTerm;

      window.addEventListener('pageshow', hideLoader);
      window.setTimeout(hideLoader, 60);
    }
  };
})();

</script>
<script>
  CivicEyeShell.init({
    activeKey: 'notifications',
    breadcrumb: [
      { label: 'Dashboard', href: 'civiceye-dashboard.html' },
      { label: 'Notifications', href: null }
    ]
  });
</script>

<script>
(function () {

  };

  /* Icon + tint per notification type */
  var TYPE_VISUAL = {
    assigned:  { tint: 'bg-blue-50 text-blue-600',    icon: '<path d="M8 7V5a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="2"/><rect x="4" y="7" width="16" height="13" rx="2" stroke="currentColor" stroke-width="2"/>' },
    started:   { tint: 'bg-purple-50 text-purple-600',icon: '<path d="M4 12a8 8 0 1 1 3 6.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 12v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
    resolved:  { tint: 'bg-emerald-50 text-emerald-600', icon: '<path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' },
    rejected:  { tint: 'bg-red-50 text-red-600',      icon: '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' },
    system:    { tint: 'bg-slate-100 text-slate-600', icon: '<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16" r="0.9" fill="currentColor"/>' },
    location:  { tint: 'bg-amber-50 text-amber-600',  icon: '<path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.5" r="2.2" stroke="currentColor" stroke-width="2"/>' }
  };

  /* ----------------------------------------------------------
     2. DUMMY DATA — no backend, static in-memory notifications
  ---------------------------------------------------------- */
  var NOTIFICATIONS = [
    {
      id: 'n1', type: 'assigned', category: 'complaint_updates', unread: true,
      title: 'Complaint Assigned', description: 'Your complaint has been assigned to the Roads & Infrastructure department.',
      complaintId: 'CE-10231', time: '10 min ago', status: 'assigned'
    },
    {
      id: 'n2', type: 'started', category: 'complaint_updates', unread: true,
      title: 'Officer Started Work', description: 'Officer Ravi Kumar has started on-site work for your reported pothole.',
      complaintId: 'CE-10231', time: '1 hr ago', status: 'in_progress'
    },
    {
      id: 'n3', type: 'location', category: 'complaint_updates', unread: true,
      title: 'Location Verification Required', description: 'Please confirm the exact location pin for accurate dispatch.',
      complaintId: 'CE-10214', time: '3 hrs ago', status: 'info'
    },
    {
      id: 'n4', type: 'resolved', category: 'resolved', unread: true,
      title: 'Complaint Resolved', description: 'The water leakage you reported has been fixed and verified by our team.',
      complaintId: 'CE-10219', time: 'Yesterday', status: 'resolved'
    },
    {

      title: 'Complaint Rejected', description: 'Your stray-animal report was reviewed and falls outside civic jurisdiction.',
      complaintId: 'CE-10198', time: '2 days ago', status: 'rejected'
    },
    {
      id: 'n6', type: 'system', category: 'system_alerts', unread: true,
      title: 'New System Update', description: 'CivicEye now supports photo evidence for complaint re-verification.',
      complaintId: null, time: '2 days ago', status: 'info'
    },
    {
      id: 'n7', type: 'resolved', category: 'resolved', unread: false,
      title: 'Complaint Resolved', description: 'Garbage overflow near Lakeview Colony has been cleared.',
      complaintId: 'CE-10228', time: '4 days ago', status: 'resolved'
    },
    {
      id: 'n8', type: 'system', category: 'system_alerts', unread: false,
      title: 'New System Update', description: 'Estimated resolution timelines are now visible on every complaint.',
      complaintId: null, time: '1 week ago', status: 'info'
    }
  ];

  /* ----------------------------------------------------------

  ---------------------------------------------------------- */
  var state = {
    activeFilter: 'unread', // Unread is active by default, per spec
    searchTerm: ''
  };

  /* ----------------------------------------------------------

  ---------------------------------------------------------- */
  var chipRow       = document.getElementById('ce-chip-row');
  var listEl        = document.getElementById('ce-notification-list');
  var resultsCount  = document.getElementById('ce-results-count');
  var searchInput   = document.getElementById('ce-search');
  var unreadPill    = document.getElementById('ce-unread-pill');
  var markAllBtn    = document.getElementById('ce-mark-all-btn');

  var emptyTpl      = document.getElementById('tpl-empty-state');

  /* ----------------------------------------------------------
     5. HELPERS
  ---------------------------------------------------------- */
  function unreadCount() {
    return NOTIFICATIONS.filter(function (n) { return n.unread; }).length;
  }

  function updateUnreadPill() {
    var count = unreadCount();
    unreadPill.textContent = count;
    unreadPill.classList.toggle('bg-[var(--ce-emerald)]', count > 0);
    unreadPill.classList.toggle('bg-slate-200', count === 0);
    unreadPill.classList.toggle('text-white', count > 0);
    unreadPill.classList.toggle('text-slate-500', count === 0);
    markAllBtn.disabled = count === 0;
  }

  function filterCounts() {
    return {
      all: NOTIFICATIONS.length,
      unread: NOTIFICATIONS.filter(function (n) { return n.unread; }).length,
      complaint_updates: NOTIFICATIONS.filter(function (n) { return n.category === 'complaint_updates'; }).length,
      resolved: NOTIFICATIONS.filter(function (n) { return n.category === 'resolved'; }).length,
      system_alerts: NOTIFICATIONS.filter(function (n) { return n.category === 'system_alerts'; }).length
    };
  }

  /* ----------------------------------------------------------
     6. RENDER: FILTER CHIPS
  ---------------------------------------------------------- */
  function renderChips() {
    var counts = filterCounts();
    var html = '';
    Object.keys(FILTERS).forEach(function (key) {
      var isActive = state.activeFilter === key;
      html += '' +
        '<button type="button" class="ce-chip shrink-0 inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-[13.5px] font-semibold border border-[var(--ce-border)] bg-white text-[var(--ce-ink)]" ' +

          FILTERS[key].label +
          '<span class="ce-chip-count inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full text-[10.5px] font-bold ' +
            (isActive ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-500') + '">' + counts[key] + '</span>' +
        '</button>';
    });
    chipRow.innerHTML = html;
  }

  /* ----------------------------------------------------------
     7. RENDER: SKELETON
  ---------------------------------------------------------- */
  function renderSkeleton() {
    var html = '';
    for (var i = 0; i < 4; i++) {
      html += '' +
        '<div class="rounded-2xl border border-[var(--ce-border)] bg-white p-4 md:p-5">' +
          '<div class="flex items-start gap-4">' +
            '<div class="ce-skeleton h-11 w-11 rounded-xl shrink-0"></div>' +
            '<div class="flex-1 min-w-0">' +
              '<div class="ce-skeleton h-3.5 w-40 rounded mb-2.5"></div>' +
              '<div class="ce-skeleton h-4 w-2/3 rounded mb-2.5"></div>' +
              '<div class="ce-skeleton h-3 w-1/3 rounded"></div>' +
            '</div>' +
            '<div class="ce-skeleton h-6 w-20 rounded-full shrink-0"></div>' +
          '</div>' +
        '</div>';
    }
    listEl.innerHTML = html;
  }

  /* ----------------------------------------------------------
     8. RENDER: NOTIFICATION LIST
  ---------------------------------------------------------- */
  function getFilteredData() {
    var term = state.searchTerm.trim().toLowerCase();
    return NOTIFICATIONS.filter(function (n) {
      var matchesFilter =
        state.activeFilter === 'all' ? true :
        state.activeFilter === 'unread' ? n.unread :
        n.category === state.activeFilter;
      if (!matchesFilter) return false;
      if (!term) return true;
      var haystack = (n.title + ' ' + n.description + ' ' + (n.complaintId || '')).toLowerCase();
      return haystack.indexOf(term) !== -1;
    });
  }

  function renderNotificationCard(n) {
    var visual = TYPE_VISUAL[n.type];
    var status = STATUS_BADGE[n.status];

    var complaintMeta = n.complaintId
      ? '<span class="inline-flex items-center gap-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="2"/></svg><span class="font-mono">' + n.complaintId + '</span></span>'
      : '';

    var viewBtn = n.complaintId
      ? '<button type="button" class="ce-view-btn ce-ghost-btn px-3.5 py-1.5 rounded-lg border border-[var(--ce-border)] text-[12.5px] font-semibold text-[var(--ce-ink)]">View Complaint</button>'
      : '';

    var markReadBtn = n.unread
      ? '<button type="button" class="ce-mark-read-btn ce-ghost-btn px-3.5 py-1.5 rounded-lg border border-[var(--ce-border)] text-[12.5px] font-semibold text-[var(--ce-ink)]">Mark as Read</button>'
      : '';

    return '' +
      '<article class="ce-notif-card ce-fade-up rounded-2xl border border-[var(--ce-border)] bg-white p-4 md:p-5 relative' + (n.unread ? ' is-unread' : '') + '" data-notif-id="' + n.id + '">' +

        (n.unread ? '<span class="ce-unread-dot absolute top-4 md:top-5 right-4 md:right-5 h-2 w-2 rounded-full bg-[var(--ce-emerald)]" aria-hidden="true"></span>' : '') +

        '<div class="flex items-start gap-4">' +
          '<div class="h-11 w-11 rounded-xl flex items-center justify-center shrink-0 ' + visual.tint + '">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">' + visual.icon + '</svg>' +
          '</div>' +

          '<div class="flex-1 min-w-0 pr-4">' +
            '<div class="flex items-center gap-2 flex-wrap">' +
              '<p class="text-[14.5px] font-semibold text-[var(--ce-ink)]">' + n.title + '</p>' +
              '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11.5px] font-semibold border ' + status.cls + '">' +
                '<span class="h-1.5 w-1.5 rounded-full ' + status.dot + '"></span>' + status.label +
              '</span>' +
            '</div>' +
            '<p class="text-[13.5px] text-[var(--ce-ink-soft)] leading-relaxed mt-1">' + n.description + '</p>' +

              complaintMeta +
              '<span>' + n.time + '</span>' +
            '</div>' +
            '<div class="flex items-center gap-2 mt-3">' + viewBtn + markReadBtn + '</div>' +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function renderEmptyState() {
    var node = emptyTpl.content.cloneNode(true);
    var isFilteredView = state.activeFilter !== 'all' || state.searchTerm.trim() !== '';
    if (isFilteredView) {
      node.querySelector('.empty-title').textContent = 'Nothing here.';
      node.querySelector('.empty-subtitle').textContent = 'No notifications match the current filter or search.';
      node.querySelector('.empty-cta-btn').textContent = 'Clear Filters';
      node.querySelector('.empty-cta-btn').classList.add('ce-clear-filters-btn');
    } else {
      node.querySelector('.empty-cta-btn').classList.add('ce-back-to-dashboard-btn');
    }
    listEl.innerHTML = '';
    listEl.appendChild(node);
  }

  function renderList() {
    var data = getFilteredData();
    resultsCount.textContent = data.length + (data.length === 1 ? ' notification' : ' notifications');

    if (data.length === 0) {
      renderEmptyState();
      return;
    }
    listEl.innerHTML = data.map(renderNotificationCard).join('');
  }

  /* Smooth cross-fade whenever filters/search change the list */
  function renderListWithTransition() {
    listEl.classList.add('is-transitioning');
    window.setTimeout(function () {
      renderList();
      listEl.classList.remove('is-transitioning');
    }, 160);
  }

  /* ----------------------------------------------------------
     9. EVENT DELEGATION
  ---------------------------------------------------------- */
  chipRow.addEventListener('click', function (e) {
    var btn = e.target.closest('.ce-chip');
    if (!btn) return;
    state.activeFilter = btn.getAttribute('data-filter');
    renderChips();
    renderListWithTransition();
  });

  searchInput.addEventListener('input', function (e) {
    state.searchTerm = e.target.value;
    renderList();
  });

  backBtn.addEventListener('click', function () {
    CivicEyeShell.navigate('civiceye-dashboard.html');
  });

  markAllBtn.addEventListener('click', function () {
    NOTIFICATIONS.forEach(function (n) { n.unread = false; });
    updateUnreadPill();
    renderChips();
    renderListWithTransition();
  });

  listEl.addEventListener('click', function (e) {
    var clearBtn = e.target.closest('.ce-clear-filters-btn');
    if (clearBtn) {
      state.activeFilter = 'all';
      state.searchTerm = '';
      searchInput.value = '';
      renderChips();
      renderListWithTransition();
      return;
    }

    var dashboardBtn = e.target.closest('.ce-back-to-dashboard-btn');
    if (dashboardBtn) {
      CivicEyeShell.navigate('civiceye-dashboard.html');
      return;
    }

    var card = e.target.closest('.ce-notif-card');
    if (!card) return;
    var id = card.getAttribute('data-notif-id');
    var notif = NOTIFICATIONS.find(function (n) { return n.id === id; });
    if (!notif) return;

    if (e.target.closest('.ce-mark-read-btn')) {
      notif.unread = false;
      updateUnreadPill();
      renderChips();
      renderList();
      // Re-apply a brief highlight to the just-updated card, if still visible
      var refreshedCard = listEl.querySelector('[data-notif-id="' + id + '"]');
      if (refreshedCard) {
        refreshedCard.classList.add('ce-just-read');
        window.setTimeout(function () { refreshedCard.classList.remove('ce-just-read'); }, 900);
      }
      return;
    }

    if (e.target.closest('.ce-view-btn')) {
      // Notifications tied to a complaint now route to its full details page.
      if (notif.complaintId) {
        CivicEyeShell.navigate('civiceye-complaint-details.html?id=' + encodeURIComponent(notif.complaintId));
      }
      return;
    }
  });

  /* ----------------------------------------------------------
     10. INITIAL LOAD SEQUENCE (simulated fetch)
  ---------------------------------------------------------- */
  renderChips();
  renderSkeleton();
  updateUnreadPill();

  setTimeout(function () {
    renderList();
  }, 650);

})();
</script>
</body>
</html>
