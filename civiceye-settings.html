<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CivicEye — Settings &amp; Preferences</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     SHARED SHELL CSS — inlined so this file works standalone in
     any preview or hosting environment (no external assets/ folder
     required). Canonical source: assets/shell.css in the full project.
  ============================================================ */
/* ==============================================================
   CivicEye — Shared Design Tokens + App Shell
   Single source of truth for every citizen-module page.
   Loaded AFTER Tailwind CDN and the Google Font link, BEFORE any
   page-specific <style> block, on every page in the module.
============================================================== */

/* ---------- 1. DESIGN TOKENS ----------
   Canonical names used by every page built from Turn 2 onward
   (My Complaints, Complaint Details, Notifications, Profile,
   Settings, Dashboard). Report Issue was authored slightly
   earlier and references --ce-sub / --ce-line instead of
   --ce-ink-soft / --ce-border — both are defined here so every
   existing page keeps working without being rewritten. */
:root{
  --ce-ink:#0B1220;
  --ce-ink-soft:#475569;
  --ce-emerald:#0E9F6E;
  --ce-emerald-dark:#0C8A5F;
  --ce-emerald-tint:#ECFDF5;
  --ce-surface:#F8FAFC;
  --ce-border:#E5E9F0;

  /* Bridged aliases for the Report Issue page's original token names */
  --ce-sub: var(--ce-ink-soft);
  --ce-line: var(--ce-border);
  --ce-amber:#D97706;
  --ce-red:#DC2626;
}

* { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
body { background: var(--ce-surface); color: var(--ce-ink); }

.ce-scroll-x { -ms-overflow-style: none; scrollbar-width: none; }
.ce-scroll-x::-webkit-scrollbar { display: none; }

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--ce-emerald);
  outline-offset: 2px;
  border-radius: 8px;
}

/* ---------- 2. SHARED ANIMATION / COMPONENT UTILITIES ----------
   Previously duplicated verbatim across every page's own <style>
   block. Consolidated here; each page's local styles now only
   contain what is genuinely unique to that page. */
@keyframes ce-fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ce-fade-up { animation: ce-fade-up 480ms cubic-bezier(0.16,1,0.3,1) both; }

.ce-hover-card {
  transition: transform 260ms cubic-bezier(0.16,1,0.3,1), box-shadow 260ms ease, border-color 260ms ease;
}
.ce-hover-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 32px -14px rgba(15,23,42,0.16);
  border-color: rgba(15,23,42,0.10);
}

.ce-cta {
  background: var(--ce-emerald);
  box-shadow: 0 1px 2px rgba(14,159,110,0.25), 0 8px 20px -8px rgba(14,159,110,0.55);
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1), background-color 220ms ease, box-shadow 220ms ease;
}
.ce-cta:hover { background: var(--ce-emerald-dark); transform: scale(1.03); }
.ce-cta:active { transform: scale(0.98); }
.ce-cta:disabled { opacity: 0.7; transform: none; cursor: default; }

.ce-ghost-btn { transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease; }
.ce-ghost-btn:hover { background-color: rgba(15,23,42,0.045); }

.ce-rippleable { position: relative; overflow: hidden; }
.ce-ripple {
  position: absolute; border-radius: 9999px;
  background: rgba(11,18,32,0.12);
  transform: scale(0);
  animation: ce-ripple-anim 620ms ease-out;
  pointer-events: none;
}
.ce-rippleable.ce-ripple-light .ce-ripple { background: rgba(255,255,255,0.5); }
@keyframes ce-ripple-anim { to { transform: scale(2.6); opacity: 0; } }

@keyframes ce-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.ce-skeleton {
  background: linear-gradient(90deg, #EDF1F6 25%, #F6F8FA 37%, #EDF1F6 63%);
  background-size: 200% 100%;
  animation: ce-shimmer 1.4s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* ==============================================================
   3. APP SHELL — header, sidebar, breadcrumb, page loader
   These are new in this build: the pieces that make every page
   behave like one connected application.
============================================================== */

/* ---------- Page loading overlay ---------- */
.ce-page-loader {
  position: fixed; inset: 0; z-index: 100;
  background: var(--ce-surface);
  display: flex; align-items: center; justify-content: center;
  opacity: 1; visibility: visible;
  transition: opacity 380ms ease, visibility 0s linear 0s;
}
.ce-page-loader.is-hidden {
  opacity: 0; visibility: hidden;
  transition: opacity 380ms ease, visibility 0s linear 380ms;
}
.ce-loader-badge {
  height: 52px; width: 52px; border-radius: 16px;
  background: var(--ce-ink);
  display: flex; align-items: center; justify-content: center;
  animation: ce-loader-pulse 1.1s ease-in-out infinite;
}
@keyframes ce-loader-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
}

/* ---------- Sticky shared header ---------- */
.ce-shell-header {
  position: sticky; top: 0; z-index: 40;
  background-color: rgba(255,255,255,0.9);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--ce-border);
}

/* ---------- Sidebar nav item ---------- */
.ce-shell-nav-item {
  transition: background-color 200ms ease, color 200ms ease, transform 180ms ease;
}
.ce-shell-nav-item:active { transform: scale(0.98); }
.ce-shell-nav-item[aria-current="page"] {
  background-color: var(--ce-ink);
  color: white;
}
.ce-shell-nav-item[aria-current="page"] svg { stroke: white; }

/* ---------- Off-canvas sidebar (mobile/tablet) ---------- */
.ce-shell-sidebar {
  transform: translateX(-100%);
  transition: transform 380ms cubic-bezier(0.16,1,0.3,1);
}
.ce-shell-sidebar.is-open { transform: translateX(0); }
@media (min-width: 1024px) {
  .ce-shell-sidebar {
    transform: none !important;
    position: static; box-shadow: none;
    width: auto; height: auto; z-index: auto;
    background: transparent; border: 0;
  }
}
.ce-shell-sidebar-backdrop {
  position: fixed; inset: 0; z-index: 45;
  background: rgba(11,18,32,0.4);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity 320ms ease;
}
.ce-shell-sidebar-backdrop.is-open { opacity: 1; pointer-events: auto; }

/* ---------- Floating-only sidebar variant ----------
   For pages (like Settings) that already have their own in-page
   sub-navigation — the app sidebar stays an off-canvas drawer
   even on desktop, instead of also claiming a static column. */
@media (min-width: 1024px) {
  .ce-shell-sidebar.ce-shell-sidebar--floating {
    position: fixed; top: 0; left: 0; z-index: 50;
    transform: translateX(-100%);
    width: 320px; height: 100%;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    background: white; border-right: 1px solid var(--ce-border);
  }
  .ce-shell-sidebar.ce-shell-sidebar--floating.is-open { transform: translateX(0); }
}

/* ---------- Profile menu dropdown ---------- */
.ce-shell-profile-menu {
  opacity: 0; pointer-events: none; transform: translateY(6px) scale(0.98);
  transition: opacity 200ms ease, transform 200ms cubic-bezier(0.16,1,0.3,1);
}
.ce-shell-profile-menu.is-open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

/* ---------- Breadcrumb ---------- */
.ce-shell-breadcrumb a { transition: color 180ms ease; }
.ce-shell-breadcrumb a:hover { color: var(--ce-ink); }

/* ---------- Main content fade/slide on arrival ---------- */
.ce-shell-content { transition: opacity 280ms ease, transform 280ms cubic-bezier(0.16,1,0.3,1); }
.ce-shell-content.is-leaving { opacity: 0; transform: translateY(8px); }

</style>

<style>
  /* ==========================================================
     PAGE-SPECIFIC STYLES ONLY — tokens, fade-up, hover-card, cta,
     ghost-btn, ripple, skeleton, scroll-x, and focus states now
     live in assets/shell.css.

     NOTE: ".ce-nav-item" below is this page's OWN in-page tab
     navigation (General/Security/Notifications/…), separate from
     the app-level ".ce-shell-nav-item" in the shared sidebar —
     not a duplicate, a different, page-specific component.
  ========================================================== */

  /* ---------- Sidebar nav (page-local Settings tabs) ---------- */
  .ce-nav-item {
    transition: background-color 200ms ease, color 200ms ease, transform 180ms ease;
  }
  .ce-nav-item:active { transform: scale(0.98); }
  .ce-nav-item[aria-current="page"] {
    background-color: var(--ce-ink);
    color: white;
  }
  .ce-nav-item[aria-current="page"] svg { stroke: white; }

  /* ---------- Toggle switch ---------- */
  .ce-toggle {
    width: 44px; height: 26px; border-radius: 9999px;
    background: #E2E8F0; border: 1px solid var(--ce-border);
    position: relative; flex-shrink: 0;
    transition: background-color 220ms ease, border-color 220ms ease;
  }
  .ce-toggle.is-on { background: var(--ce-emerald); border-color: var(--ce-emerald); }
  .ce-toggle-knob {
    position: absolute; top: 2px; left: 2px;
    height: 20px; width: 20px; border-radius: 9999px; background: white;
    box-shadow: 0 1px 2px rgba(0,0,0,0.18);
    transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1);
  }
  .ce-toggle.is-on .ce-toggle-knob { transform: translateX(18px); }
  .ce-toggle:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Tab panel fade transition ---------- */
  #ce-settings-panel { transition: opacity 200ms ease, transform 200ms ease; }
  #ce-settings-panel.is-transitioning { opacity: 0; transform: translateY(6px); }

  /* ---------- Theme preview cards ---------- */
  .ce-theme-card {
    transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
  }
  .ce-theme-card:hover { transform: translateY(-2px); }
  .ce-theme-card[aria-pressed="true"] {
    border-color: var(--ce-emerald);
    box-shadow: 0 0 0 3px rgba(14,159,110,0.15);
  }

  /* ---------- Accent + font-size chips ---------- */
  .ce-swatch { transition: transform 180ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 180ms ease; }
  .ce-swatch[aria-pressed="true"] { transform: scale(1.12); box-shadow: 0 0 0 3px rgba(15,23,42,0.12); }
  .ce-font-chip[aria-pressed="true"] { background-color: var(--ce-ink); color: white; }

  /* ---------- Skeleton loading ---------- */
  @keyframes ce-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .ce-skeleton {
    background: linear-gradient(90deg, #EDF1F6 25%, #F6F8FA 37%, #EDF1F6 63%);
    background-size: 200% 100%;
    animation: ce-shimmer 1.4s ease-in-out infinite;
  }

  /* ---------- Confirm modal ---------- */
  #ce-confirm-backdrop { opacity: 0; pointer-events: none; transition: opacity 260ms ease; }
  #ce-confirm-backdrop.is-open { opacity: 1; pointer-events: auto; }
  #ce-confirm-panel {
    transform: translateY(14px) scale(0.97); opacity: 0;
    transition: transform 320ms cubic-bezier(0.16,1,0.3,1), opacity 260ms ease;
  }
  #ce-confirm-backdrop.is-open #ce-confirm-panel { transform: translateY(0) scale(1); opacity: 1; }
</style>
</head>
<body>

<!-- Shell mounts: header renders normally; the app sidebar stays
     an off-canvas drawer (floating mode) since this page already
     has its own in-page tab navigation below. -->
<div id="ce-shell-sidebar-mount"></div>
<div id="ce-shell-header-mount"></div>

<main id="ce-shell-content" class="ce-shell-content max-w-7xl mx-auto px-5 md:px-8 py-8 md:py-10">

  <div id="ce-shell-breadcrumb-mount"></div>

  <!-- =========================================================
       PAGE HEADER
  ========================================================== -->
  <header class="ce-fade-up flex items-start gap-4 mb-7">
    <button
      id="ce-back-btn"
      type="button"
      aria-label="Go back"
      class="ce-ghost-btn shrink-0 h-10 w-10 md:h-11 md:w-11 flex items-center justify-center rounded-full border border-[var(--ce-border)] bg-white"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 5L8 12l7 7" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="flex-1 min-w-0">
      <h1 class="text-[22px] md:text-[26px] font-extrabold tracking-tight text-[var(--ce-ink)]">Settings &amp; Preferences</h1>
      <p class="text-[13.5px] md:text-[14.5px] text-[var(--ce-ink-soft)] mt-0.5">Manage your account settings and preferences.</p>
    </div>
  </header>

  <!-- =========================================================
       THREE-REGION LAYOUT
       Sidebar nav → Settings panel → Account summary
  ========================================================== -->
  <div class="grid grid-cols-1 lg:grid-cols-[220px_minmax(0,1fr)_280px] gap-6 items-start">

    <!-- ===================== SIDEBAR NAV ===================== -->
    <nav
      id="ce-settings-nav"
      class="ce-fade-up ce-scroll-x flex flex-row lg:flex-col gap-1.5 overflow-x-auto lg:overflow-visible rounded-2xl border border-[var(--ce-border)] bg-white p-2 lg:p-2.5 lg:sticky lg:top-6"
      aria-label="Settings sections"
    >
      <!-- rendered by JS -->
    </nav>

    <!-- ===================== SETTINGS PANEL ===================== -->
    <section aria-label="Settings content" class="min-w-0">
      <div id="ce-settings-panel" class="flex flex-col gap-5">
        <!-- populated by JS: skeleton → active tab content -->
      </div>
    </section>

    <!-- ===================== RIGHT SIDEBAR: ACCOUNT SUMMARY ===================== -->
    <aside class="ce-fade-up ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 lg:sticky lg:top-6" aria-labelledby="ce-summary-heading">
      <h2 id="ce-summary-heading" class="text-[15px] font-bold text-[var(--ce-ink)] mb-4">Account Summary</h2>

      <div class="mb-4">
        <div class="flex items-center justify-between mb-1.5">
          <p class="text-[12.5px] text-[var(--ce-ink-soft)] font-medium">Profile Completion</p>
          <p class="text-[12.5px] font-bold text-[var(--ce-ink)]">82%</p>
        </div>
        <div class="h-2 rounded-full bg-slate-100 overflow-hidden" role="progressbar" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100" aria-label="Profile completion: 82 percent">
          <div id="ce-profile-completion-bar" class="h-full rounded-full bg-[var(--ce-emerald)]" style="width:0%"></div>
        </div>
      </div>

      <dl class="flex flex-col divide-y divide-[var(--ce-border)] text-[13px]">
        <div class="flex items-center justify-between py-2.5">
          <dt class="text-slate-400">Member Since</dt>
          <dd class="font-medium text-[var(--ce-ink)]">Mar 2025</dd>
        </div>
        <div class="flex items-center justify-between py-2.5">
          <dt class="text-slate-400">Citizen Rating</dt>
          <dd class="flex items-center gap-1 font-medium text-[var(--ce-ink)]">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--ce-emerald)" aria-hidden="true"><path d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 7-6.2-3.6L5.8 21.2 7 14.2l-5-4.9 7.1-.7L12 2Z"/></svg>
            4.8
          </dd>
        </div>
      </dl>
    </aside>

  </div>
</main>

<!-- ============================================================
     SHELL BOOTSTRAP — shared header, sidebar, breadcrumb, transitions
     sidebarMode: 'floating' — this page already has its own in-page
     tab navigation, so the app sidebar stays an off-canvas drawer.
============================================================= -->
<script>
  /* ============================================================
     SHARED SHELL JS — inlined so this file works standalone in
     any preview or hosting environment. Canonical source:
     assets/shell.js in the full project.
  ============================================================ */
/* ==============================================================
   CivicEye — Shared App Shell (JavaScript)
   One reusable navigation system for every citizen-module page.
   Each page calls CivicEyeShell.init({ activeKey, breadcrumb })
   in a small bootstrap <script> right after <body> opens.
============================================================== */
(function () {
  'use strict';

  /* ----------------------------------------------------------
     1. SITE MAP — single source of truth for nav + routing
  ---------------------------------------------------------- */
  var PAGES = {
    dashboard:     { label: 'Dashboard',     href: 'civiceye-dashboard.html',
      icon: '<rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/>' },
    'report-issue':{ label: 'Report Issue',  href: 'civiceye-report-issue.html',
      icon: '<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' },
    'my-complaints': { label: 'My Complaints', href: 'civiceye-my-complaints.html',
      icon: '<path d="M6 4h9l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' },
    notifications: { label: 'Notifications', href: 'civiceye-notifications.html',
      icon: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' },
    profile:       { label: 'Profile',       href: 'civiceye-profile.html',
      icon: '<circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' },
    settings:      { label: 'Settings',      href: 'civiceye-settings.html',
      icon: '<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.6-2-3.4-2.4.8a7.9 7.9 0 0 0-2.6-1.5L14 2h-4l-.4 2.8a7.9 7.9 0 0 0-2.6 1.5l-2.4-.8-2 3.4 2 1.6a7.9 7.9 0 0 0 0 3l-2 1.6 2 3.4 2.4-.8a7.9 7.9 0 0 0 2.6 1.5L10 22h4l.4-2.8a7.9 7.9 0 0 0 2.6-1.5l2.4.8 2-3.4-2-1.6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' },
    /* Reachable but not a primary sidebar item — it's a detail/child page */
    'complaint-details': { label: 'Complaint Details', href: 'civiceye-complaint-details.html', icon: '' }
  };

  /* Sidebar shows these, in this order (complaint-details is intentionally excluded) */
  var SIDEBAR_ORDER = ['dashboard', 'report-issue', 'my-complaints', 'notifications', 'profile', 'settings'];

  var DUMMY_UNREAD_COUNT = 4; // mirrors the seed data on the Notifications page

  /* ----------------------------------------------------------
     2. DOM BOOTSTRAP HELPERS
  ---------------------------------------------------------- */
  function el(html) {
    var wrap = document.createElement('div');
    wrap.innerHTML = html.trim();
    return wrap.firstElementChild;
  }

  /* ----------------------------------------------------------
     3. PAGE LOADER (shown briefly on arrival, and again on
        navigation before leaving the page)
  ---------------------------------------------------------- */
  function mountLoader() {
    var existing = document.getElementById('ce-page-loader');
    if (existing) return existing;
    var loader = el(
      '<div id="ce-page-loader" class="ce-page-loader" aria-hidden="true">' +
        '<div class="flex flex-col items-center gap-3.5">' +
          '<span class="ce-loader-badge">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
              '<path d="M1.5 12C3.7 7.2 7.5 4.7 12 4.7c4.5 0 8.3 2.5 10.5 7.3-2.2 4.8-6 7.3-10.5 7.3-4.5 0-8.3-2.5-10.5-7.3Z" stroke="#ECFDF5" stroke-width="1.6" stroke-linejoin="round"/>' +
              '<circle cx="12" cy="12" r="3.1" fill="#0E9F6E"/>' +
            '</svg>' +
          '</span>' +
          '<span class="text-[12.5px] font-semibold text-[var(--ce-ink-soft)]">Loading…</span>' +
        '</div>' +
      '</div>'
    );
    document.body.insertBefore(loader, document.body.firstChild);
    return loader;
  }

  function hideLoader() {
    var loader = document.getElementById('ce-page-loader');
    if (!loader) return;
    // Small delay so the loader is never a single-frame flash
    window.setTimeout(function () { loader.classList.add('is-hidden'); }, 220);
  }

  /* Navigate with a brief loading overlay — the shared "page transition" */
  function navigate(href) {
    if (!href) return;
    var loader = document.getElementById('ce-page-loader');
    var content = document.getElementById('ce-shell-content');
    if (content) content.classList.add('is-leaving');
    if (loader) loader.classList.remove('is-hidden');
    window.setTimeout(function () { window.location.href = href; }, 260);
  }

  /* ----------------------------------------------------------
     4. SHARED HEADER
  ---------------------------------------------------------- */
  function renderHeader(activeKey, sidebarMode) {
    var mount = document.getElementById('ce-shell-header-mount');
    if (!mount) return;
    var toggleVisibilityClass = sidebarMode === 'floating' ? '' : 'lg:hidden';

    var header = el(
      '<header class="ce-shell-header">' +
        '<div class="max-w-[1400px] mx-auto px-5 md:px-8 h-16 md:h-[68px] flex items-center justify-between gap-3">' +

          '<div class="flex items-center gap-2.5 min-w-0">' +
            '<button type="button" id="ce-shell-sidebar-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="ce-shell-sidebar" class="ce-ghost-btn ' + toggleVisibilityClass + ' h-10 w-10 shrink-0 rounded-full border border-[var(--ce-border)] bg-white flex items-center justify-center">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="#0B1220" stroke-width="2" stroke-linecap="round"/></svg>' +
            '</button>' +
            '<button type="button" class="ce-shell-logo-btn flex items-center gap-2 shrink-0" data-ce-href="' + PAGES.dashboard.href + '" aria-label="CivicEye — dashboard">' +
              '<span class="h-8 w-8 rounded-lg bg-[var(--ce-ink)] flex items-center justify-center">' +

      profileBtn.setAttribute('aria-expanded', String(isOpen));

      if (e.key === 'Escape') closeProfileMenu();
    });

    var logoutBtn = header.querySelector('#ce-shell-logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function () {
        // No auth/backend in this build — dummy action only.
        closeProfileMenu();
      });
    }
  }

  /* ----------------------------------------------------------
     5. SHARED SIDEBAR
  ---------------------------------------------------------- */
  function renderSidebar(activeKey, sidebarMode) {
    var mount = document.getElementById('ce-shell-sidebar-mount');
    if (!mount) return;

    var navItemsHtml = SIDEBAR_ORDER.map(function (key) {
      var page = PAGES[key];
      var isActive = key === activeKey;
      return '' +
        '<button type="button" class="ce-shell-nav-item ce-rippleable w-full flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-[13.5px] font-semibold text-[var(--ce-ink)] text-left" ' +
        'data-ce-href="' + page.href + '"' + (isActive ? ' aria-current="page"' : '') + '>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor">' + page.icon + '</svg>' +
          page.label +
        '</button>';
    }).join('');

    var isFloating = sidebarMode === 'floating';
    var desktopClasses = isFloating ? '' : ' lg:static lg:z-auto lg:w-[220px] lg:shrink-0 lg:p-0 lg:sticky lg:top-6 lg:h-auto';
    var floatingClass = isFloating ? ' ce-shell-sidebar--floating' : '';

    var backdrop = el('<div id="ce-shell-sidebar-backdrop" class="ce-shell-sidebar-backdrop' + (isFloating ? '' : ' lg:hidden') + '"></div>');
    var sidebar = el(
      '<aside id="ce-shell-sidebar" class="ce-shell-sidebar' + floatingClass + ' fixed top-0 left-0 z-50 h-full w-[78%] max-w-xs overflow-y-auto bg-white p-4 flex flex-col gap-1.5' + desktopClasses + '" aria-label="Primary navigation">' +
        '<div class="flex items-center justify-between mb-2' + (isFloating ? '' : ' lg:hidden') + '">' +
          '<span class="text-[15px] font-extrabold tracking-tight text-[var(--ce-ink)]">Civic<span class="text-[var(--ce-emerald)]">Eye</span></span>' +
          '<button type="button" id="ce-shell-sidebar-close" aria-label="Close menu" class="ce-ghost-btn h-9 w-9 rounded-full flex items-center justify-center border border-[var(--ce-border)]">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="#0B1220" stroke-width="2" stroke-linecap="round"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="lg:rounded-2xl lg:border lg:border-[var(--ce-border)] lg:bg-white lg:p-2.5 flex flex-col gap-1">' +
          navItemsHtml +
        '</div>' +
      '</aside>'
    );

    mount.replaceWith(sidebar);
    document.body.appendChild(backdrop);

    var toggleBtn = document.getElementById('ce-shell-sidebar-toggle');
    var closeBtn = sidebar.querySelector('#ce-shell-sidebar-close');

    function openSidebar() {
      sidebar.classList.add('is-open');
      backdrop.classList.add('is-open');
      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }
    function closeSidebar() {
      sidebar.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      if (toggleBtn) toggleBtn.focus();
    }
    if (toggleBtn) toggleBtn.addEventListener('click', openSidebar);
    closeBtn.addEventListener('click', closeSidebar);
    backdrop.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sidebar.classList.contains('is-open')) closeSidebar();
    });
    window.addEventListener('resize', function () {
      if (!isFloating && window.innerWidth >= 1024 && sidebar.classList.contains('is-open')) closeSidebar();
    });

    /* Close the mobile sidebar automatically when a nav item is chosen */
    sidebar.addEventListener('click', function (e) {
      if (e.target.closest('[data-ce-href]')) closeSidebar();
    });
  }

  /* ----------------------------------------------------------
     6. BREADCRUMB
  ---------------------------------------------------------- */
  function renderBreadcrumb(trail) {
    var mount = document.getElementById('ce-shell-breadcrumb-mount');
    if (!mount || !trail || !trail.length) return;

    var html = trail.map(function (crumb, i) {
      var isLast = i === trail.length - 1;
      var sep = i > 0 ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="mx-1 shrink-0"><path d="M9 6l6 6-6 6" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
      if (isLast || !crumb.href) {
        return sep + '<span class="text-[12.5px] font-semibold text-[var(--ce-ink)]" aria-current="page">' + crumb.label + '</span>';
      }
      return sep + '<button type="button" class="text-[12.5px] font-medium text-[var(--ce-ink-soft)]" data-ce-href="' + crumb.href + '">' + crumb.label + '</button>';
    }).join('');

    var nav = el('<nav aria-label="Breadcrumb" class="ce-shell-breadcrumb flex items-center flex-wrap mb-4">' + html + '</nav>');
    mount.replaceWith(nav);
  }

  /* ----------------------------------------------------------
     7. GLOBAL NAVIGATION WIRING
     Any element with data-ce-href routes through the shared
     transition instead of a plain, jarring page-jump.
  ---------------------------------------------------------- */
  function wireNavigation() {
    document.addEventListener('click', function (e) {
      var trigger = e.target.closest('[data-ce-href]');
      if (!trigger) return;
      e.preventDefault();
      navigate(trigger.getAttribute('data-ce-href'));
    });
  }

  /* ----------------------------------------------------------
     8. PUBLIC API
  ---------------------------------------------------------- */
  window.CivicEyeShell = {
    PAGES: PAGES,
    navigate: navigate,
    init: function (config) {
      config = config || {};
      mountLoader();
      renderHeader(config.activeKey, config.sidebarMode);
      renderSidebar(config.activeKey, config.sidebarMode);
      renderBreadcrumb(config.breadcrumb);
      wireNavigation();

      /* Pre-fill the shared search box if we arrived via a search link */
      var params = new URLSearchParams(window.location.search);
      var searchTerm = params.get('search');
      var searchBox = document.getElementById('ce-shell-search');
      if (searchTerm && searchBox) searchBox.value = searchTerm;

      window.addEventListener('pageshow', hideLoader);
      window.setTimeout(hideLoader, 60);
    }
  };
})();

</script>

            '<span id="ce-save-status" class="text-[12.5px] text-emerald-600 font-medium opacity-0 transition-opacity duration-300">Saved ✓</span>' +
          '</div>' +
        '</form>' +
      '</section>';
  }

  function renderSecurityPanel() {
    var passwordFormMarkup = state.passwordFormOpen
      ? '<div class="grid sm:grid-cols-2 gap-3.5 mt-4 pt-4 border-t border-[var(--ce-border)]">' +
          '<div class="sm:col-span-2"><label for="s-current" class="block text-[12.5px] font-medium text-slate-400 mb-1.5">Current Password</label><input id="s-current" type="password" class="w-full h-11 px-3.5 rounded-xl border border-[var(--ce-border)] text-[14px] focus:border-[var(--ce-emerald)] transition-colors" /></div>' +
          '<div><label for="s-new" class="block text-[12.5px] font-medium text-slate-400 mb-1.5">New Password</label><input id="s-new" type="password" class="w-full h-11 px-3.5 rounded-xl border border-[var(--ce-border)] text-[14px] focus:border-[var(--ce-emerald)] transition-colors" /></div>' +
          '<div><label for="s-confirm" class="block text-[12.5px] font-medium text-slate-400 mb-1.5">Confirm Password</label><input id="s-confirm" type="password" class="w-full h-11 px-3.5 rounded-xl border border-[var(--ce-border)] text-[14px] focus:border-[var(--ce-emerald)] transition-colors" /></div>' +
          '<div class="sm:col-span-2"><button type="button" id="ce-save-password-btn" class="ce-cta inline-flex items-center h-10 px-4 rounded-full text-[13.5px] font-semibold text-white">Update Password</button></div>' +
        '</div>'
      : '';

    return '' +
      '<div class="flex flex-col gap-5">' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<div class="flex items-center justify-between gap-4">' +
            '<div class="min-w-0"><p class="text-[14.5px] font-bold text-[var(--ce-ink)]">Change Password</p><p class="text-[12.5px] text-[var(--ce-ink-soft)] mt-0.5">Last updated 3 months ago.</p></div>' +
            '<button type="button" id="ce-toggle-password-form-btn" class="ce-ghost-btn shrink-0 px-4 py-2 rounded-lg border border-[var(--ce-border)] text-[13px] font-semibold text-[var(--ce-ink)]">' + (state.passwordFormOpen ? 'Cancel' : 'Update') + '</button>' +
          '</div>' +
          passwordFormMarkup +
        '</section>' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          toggleRow('twoFactor', 'Two-Factor Authentication', 'Adds an extra layer of security at sign-in.', state.twoFactorEnabled, false) +
        '</section>' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<h3 class="text-[14.5px] font-bold text-[var(--ce-ink)] mb-3.5">Active Sessions</h3>' +
          '<div class="flex flex-col divide-y divide-[var(--ce-border)]">' +
            SESSIONS.map(function (s, i) {
              return '' +
                '<div class="flex items-center gap-3 py-3">' +
                  '<span class="h-9 w-9 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">' +
                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 20h6M12 16v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
                  '</span>' +
                  '<div class="flex-1 min-w-0">' +
                    '<p class="text-[13.5px] font-semibold text-[var(--ce-ink)]">' + s.device + (s.current ? ' <span class="text-[11px] font-semibold text-emerald-600">· This device</span>' : '') + '</p>' +
                    '<p class="text-[12px] text-slate-400">' + s.location + ' · ' + s.time + '</p>' +
                  '</div>' +
                  (s.current ? '' : '<button type="button" class="ce-signout-session-btn ce-ghost-btn shrink-0 px-3 py-1.5 rounded-lg border border-[var(--ce-border)] text-[12px] font-semibold text-[var(--ce-ink)]" data-session-index="' + i + '">Sign Out</button>') +
                '</div>';
            }).join('') +
          '</div>' +
        '</section>' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<h3 class="text-[14.5px] font-bold text-[var(--ce-ink)] mb-3.5">Recent Login Activity</h3>' +
          '<div class="flex flex-col divide-y divide-[var(--ce-border)]">' +
            LOGIN_ACTIVITY.map(function (a) {
              return '<div class="py-3"><p class="text-[13.5px] font-medium text-[var(--ce-ink)]">' + a.detail + '</p><p class="text-[12px] text-slate-400 mt-0.5">' + a.time + '</p></div>';
            }).join('') +
          '</div>' +
        '</section>' +

      '</div>';
  }

  function renderNotificationsPanel() {
    var t = state.notificationToggles;
    return '' +
      '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6" aria-labelledby="ce-notif-heading">' +
        '<h2 id="ce-notif-heading" class="text-[15px] font-bold text-[var(--ce-ink)] mb-1">Notifications</h2>' +
        '<p class="text-[12.5px] text-[var(--ce-ink-soft)] mb-2">Choose what you want to be notified about.</p>' +
        '<div class="flex flex-col divide-y divide-[var(--ce-border)]">' +
          toggleRow('complaint_updates', 'Complaint Updates', 'Status changes on any complaint you\'ve filed.', t.complaint_updates, false) +
          toggleRow('assignment_updates', 'Assignment Updates', 'When your complaint is assigned to an officer.', t.assignment_updates, false) +
          toggleRow('resolution_updates', 'Resolution Updates', 'When a complaint is marked resolved or rejected.', t.resolution_updates, false) +
          toggleRow('email_notifications', 'Email Notifications', 'Receive the above updates via email.', t.email_notifications, false) +
          toggleRow('sms_notifications', 'SMS Notifications', 'Receive the above updates via SMS.', t.sms_notifications, false) +
        '</div>' +
      '</section>';
  }

  function renderPrivacyPanel() {
    return '' +
      '<div class="flex flex-col gap-5">' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<label for="p-visibility" class="block text-[14px] font-semibold text-[var(--ce-ink)] mb-1">Profile Visibility</label>' +
          '<p class="text-[12.5px] text-[var(--ce-ink-soft)] mb-3">Control who can see your citizen profile.</p>' +
          '<select id="p-visibility" class="w-full sm:w-64 h-11 px-3.5 rounded-xl border border-[var(--ce-border)] text-[14px] bg-white focus:border-[var(--ce-emerald)] transition-colors">' +
            ['public: Public', 'officers: Officers Only', 'private: Private'].map(function (opt) {
              var parts = opt.split(': ');
              return '<option value="' + parts[0] + '"' + (parts[0] === state.profileVisibility ? ' selected' : '') + '>' + parts[1] + '</option>';
            }).join('') +
          '</select>' +
        '</section>' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<div class="flex items-center justify-between gap-4">' +
            '<div class="min-w-0">' +
              '<p class="text-[14px] font-semibold text-[var(--ce-ink)]">Location Sharing <span class="text-[10.5px] font-semibold text-slate-400 align-middle">· Coming soon</span></p>' +
              '<p class="text-[12.5px] text-[var(--ce-ink-soft)] mt-0.5">Share live location with the assigned officer during resolution.</p>' +
            '</div>' +
            toggleMarkup('location_sharing', state.locationSharingEnabled, true) +
          '</div>' +
        '</section>' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<div class="flex items-center justify-between gap-4 flex-wrap">' +
            '<div class="min-w-0"><p class="text-[14px] font-semibold text-[var(--ce-ink)]">Data Download</p><p class="text-[12.5px] text-[var(--ce-ink-soft)] mt-0.5">Request a copy of all data associated with your account.</p></div>' +
            '<button type="button" id="ce-request-export-btn" class="ce-ghost-btn shrink-0 px-4 py-2 rounded-lg border border-[var(--ce-border)] text-[13px] font-semibold text-[var(--ce-ink)]">Request Export</button>' +
          '</div>' +
          '<p id="ce-export-status" class="text-[12.5px] text-emerald-600 font-medium mt-3 opacity-0 transition-opacity duration-300">Export requested — we\'ll email you a link shortly.</p>' +
        '</section>' +

        '<section class="rounded-2xl border border-red-200 bg-red-50/40 p-5 md:p-6">' +
          '<p class="text-[14px] font-bold text-red-600">Danger Zone</p>' +
          '<p class="text-[12.5px] text-red-500/80 mt-0.5 mb-3.5">Deleting your account permanently removes your profile and complaint history. This cannot be undone.</p>' +
          '<button type="button" id="ce-delete-account-btn" class="inline-flex items-center h-10 px-4 rounded-full border border-red-300 bg-white text-red-600 text-[13px] font-semibold hover:bg-red-100 transition-colors">Delete Account</button>' +
        '</section>' +

      '</div>';
  }

  function renderAppearancePanel() {
    var themes = [
      { key: 'light',  label: 'Light',  swatch: 'bg-white border border-slate-200' },
      { key: 'dark',   label: 'Dark',   swatch: 'bg-[#0B1220]' },
      { key: 'system', label: 'System', swatch: 'bg-gradient-to-br from-white to-[#0B1220]' }
    ];
    var accents = [
      { key: 'emerald', cls: 'bg-emerald-500' },
      { key: 'blue',    cls: 'bg-blue-500' },
      { key: 'purple',  cls: 'bg-purple-500' },
      { key: 'amber',   cls: 'bg-amber-500' }
    ];
    var previewBg = state.theme === 'dark' ? '#0B1220' : '#FFFFFF';
    var previewText = state.theme === 'dark' ? '#F8FAFC' : '#0B1220';
    var previewSub = state.theme === 'dark' ? '#94A3B8' : '#64748B';

    return '' +
      '<div class="flex flex-col gap-5">' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<h2 class="text-[15px] font-bold text-[var(--ce-ink)] mb-1">Theme</h2>' +
          '<p class="text-[12.5px] text-[var(--ce-ink-soft)] mb-4">Preview only — the CivicEye system theme stays consistent across pages.</p>' +

          '<div class="grid grid-cols-3 gap-3 mb-5">' +
            themes.map(function (t) {
              var isActive = state.theme === t.key;
              return '' +
                '<button type="button" class="ce-theme-card" data-theme-key="' + t.key + '" aria-pressed="' + isActive + '">' +
                  '<span class="block w-full h-full rounded-xl border-2 ' + (isActive ? 'border-[var(--ce-emerald)]' : 'border-[var(--ce-border)]') + ' p-2.5">' +
                    '<span class="block h-12 rounded-lg ' + t.swatch + ' mb-2"></span>' +
                    '<span class="block text-[12.5px] font-semibold text-[var(--ce-ink)] text-center">' + t.label + '</span>' +
                  '</span>' +
                '</button>';
            }).join('') +
          '</div>' +

          '<div class="rounded-xl border border-[var(--ce-border)] p-4 transition-colors duration-300" style="background-color:' + previewBg + '">' +
            '<p class="text-[13px] font-bold transition-colors duration-300" style="color:' + previewText + '">Preview card</p>' +
            '<p class="text-[12px] mt-1 transition-colors duration-300" style="color:' + previewSub + '">This is how a card would read in the selected theme.</p>' +
          '</div>' +
        '</section>' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<h2 class="text-[15px] font-bold text-[var(--ce-ink)] mb-1">Accent Color</h2>' +
          '<p class="text-[12.5px] text-[var(--ce-ink-soft)] mb-4">Preview only — CivicEye\'s emerald accent stays the product default.</p>' +
          '<div class="flex items-center gap-3">' +
            accents.map(function (a) {
              var isActive = state.accent === a.key;
              return '<button type="button" class="ce-swatch h-9 w-9 rounded-full ' + a.cls + '" data-accent-key="' + a.key + '" aria-pressed="' + isActive + '" aria-label="' + a.key + ' accent"></button>';
            }).join('') +
          '</div>' +
        '</section>' +

        '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<h2 class="text-[15px] font-bold text-[var(--ce-ink)] mb-1">Font Size</h2>' +
          '<p class="text-[12.5px] text-[var(--ce-ink-soft)] mb-4">UI placeholder only — does not resize this demo.</p>' +
          '<div class="inline-flex rounded-xl border border-[var(--ce-border)] p-1 gap-1">' +
            ['small', 'medium', 'large'].map(function (size) {
              var isActive = state.fontSize === size;
              return '<button type="button" class="ce-font-chip px-4 py-1.5 rounded-lg text-[13px] font-semibold text-[var(--ce-ink)] capitalize" data-font-key="' + size + '" aria-pressed="' + isActive + '">' + size + '</button>';
            }).join('') +
          '</div>' +
        '</section>' +

      '</div>';
  }

  function renderHelpPanel() {
    return '' +
      '<section class="ce-hover-card rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6" aria-labelledby="ce-help-heading">' +
        '<h2 id="ce-help-heading" class="text-[15px] font-bold text-[var(--ce-ink)] mb-3.5">Help &amp; Support</h2>' +
        '<div class="flex flex-col divide-y divide-[var(--ce-border)]">' +
          HELP_LINKS.map(function (h) {
            return '' +
              '<button type="button" class="ce-help-link-btn ce-ghost-btn w-full flex items-center gap-3 py-3.5 text-left">' +
                '<span class="flex-1 min-w-0">' +
                  '<span class="block text-[13.5px] font-semibold text-[var(--ce-ink)]">' + h.title + '</span>' +
                  '<span class="block text-[12px] text-slate-400 mt-0.5">' + h.desc + '</span>' +
                '</span>' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="shrink-0"><path d="M9 6l6 6-6 6" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
              '</button>';
          }).join('') +
        '</div>' +
      '</section>';
  }

  var PANEL_RENDERERS = {
    general: renderGeneralPanel,
    security: renderSecurityPanel,
    notifications: renderNotificationsPanel,
    privacy: renderPrivacyPanel,
    appearance: renderAppearancePanel,
    help: renderHelpPanel
  };

  /* ----------------------------------------------------------
     7. RENDER: SKELETON
  ---------------------------------------------------------- */
  function renderPanelSkeleton() {
    var html = '';
    for (var i = 0; i < 2; i++) {
      html += '' +
        '<div class="rounded-2xl border border-[var(--ce-border)] bg-white p-5 md:p-6">' +
          '<div class="ce-skeleton h-4 w-32 rounded mb-5"></div>' +
          '<div class="ce-skeleton h-11 w-full rounded-xl mb-3.5"></div>' +
          '<div class="ce-skeleton h-11 w-full rounded-xl mb-3.5"></div>' +
          '<div class="ce-skeleton h-11 w-1/2 rounded-xl"></div>' +
        '</div>';
    }
    panelEl.innerHTML = html;
  }

  /* ----------------------------------------------------------
     8. PANEL SWITCHING (smooth fade transition)
  ---------------------------------------------------------- */
  function renderActivePanel() {
    var renderer = PANEL_RENDERERS[state.activeTab];
    panelEl.innerHTML = renderer ? renderer() : '';
  }

  function switchTab(tabKey) {
    if (tabKey === state.activeTab) return;
    state.activeTab = tabKey;
    state.passwordFormOpen = false;
    renderNav();

    panelEl.classList.add('is-transitioning');
    window.setTimeout(function () {
      renderActivePanel();
      panelEl.classList.remove('is-transitioning');
    }, 180);
  }

  /* ----------------------------------------------------------
     9. RIPPLE MICRO-INTERACTION (delegated globally)
  ---------------------------------------------------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('.ce-rippleable');
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var ripple = document.createElement('span');
    ripple.className = 'ce-ripple';
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    el.appendChild(ripple);
    window.setTimeout(function () { ripple.remove(); }, 650);
  });

  /* ----------------------------------------------------------
     10. CONFIRM MODAL (Delete Account / Logout)
  ---------------------------------------------------------- */
  function openConfirm(title, message, confirmLabel, isDanger, onConfirm) {
    lastFocusedEl = document.activeElement;
    confirmTitle.textContent = title;
    confirmMessage.textContent = message;
    confirmOk.textContent = confirmLabel;
    confirmOk.className = isDanger
      ? 'flex-1 h-11 rounded-xl text-[14px] font-semibold text-white bg-red-600 hover:bg-red-700 transition-colors'
      : 'ce-cta flex-1 h-11 rounded-xl text-[14px] font-semibold text-white';
    pendingConfirmAction = onConfirm;
    confirmBackdrop.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    confirmOk.focus();
  }

  function closeConfirm() {
    confirmBackdrop.classList.remove('is-open');
    document.body.style.overflow = '';
    pendingConfirmAction = null;
    if (lastFocusedEl) lastFocusedEl.focus();
  }

  confirmOk.addEventListener('click', function () {
    if (pendingConfirmAction) pendingConfirmAction();
    closeConfirm();
  });
  confirmCancel.addEventListener('click', closeConfirm);
  confirmBackdrop.addEventListener('click', function (e) { if (e.target === confirmBackdrop) closeConfirm(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && confirmBackdrop.classList.contains('is-open')) closeConfirm();
  });

  /* ----------------------------------------------------------
     11. EVENT DELEGATION — NAV
  ---------------------------------------------------------- */
  navEl.addEventListener('click', function (e) {
    var tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { switchTab(tabBtn.getAttribute('data-tab')); return; }

    if (e.target.closest('#ce-logout-nav-btn')) {
      openConfirm('Log out of CivicEye?', 'You\'ll need to sign in again to access your complaints and profile.', 'Log Out', false, function () {
        // No real session to end in this isolated build — dummy confirm only.
      });
    }
  });

  /* ----------------------------------------------------------
     12. EVENT DELEGATION — SETTINGS PANEL
     Attached once to the stable container; survives innerHTML swaps.
  ---------------------------------------------------------- */
  panelEl.addEventListener('click', function (e) {

    /* ---- Toggle switches (shared across tabs) ---- */
    var toggleBtn = e.target.closest('.ce-toggle');
    if (toggleBtn && !toggleBtn.disabled) {
      var key = toggleBtn.getAttribute('data-toggle-key');
      var nowOn = !toggleBtn.classList.contains('is-on');
      toggleBtn.classList.toggle('is-on', nowOn);
      toggleBtn.setAttribute('aria-checked', String(nowOn));

      if (key === 'twoFactor') state.twoFactorEnabled = nowOn;
      else if (state.notificationToggles.hasOwnProperty(key)) state.notificationToggles[key] = nowOn;
      return;
    }

    /* ---- Change Password: expand/collapse inline form ---- */
    if (e.target.closest('#ce-toggle-password-form-btn')) {
      state.passwordFormOpen = !state.passwordFormOpen;
      renderActivePanel();
      return;
    }
    if (e.target.closest('#ce-save-password-btn')) {
      state.passwordFormOpen = false;
      renderActivePanel();
      return;
    }

    /* ---- Sign out a session (dummy) ---- */
    var signOutBtn = e.target.closest('.ce-signout-session-btn');
    if (signOutBtn) {
      var idx = Number(signOutBtn.getAttribute('data-session-index'));
      SESSIONS.splice(idx, 1);
      renderActivePanel();
      return;
    }

    /* ---- Data export request (dummy feedback) ---- */
    if (e.target.closest('#ce-request-export-btn')) {
      var exportStatus = document.getElementById('ce-export-status');
      if (exportStatus) exportStatus.style.opacity = '1';
      return;
    }

    /* ---- Delete account (danger zone) ---- */
    if (e.target.closest('#ce-delete-account-btn')) {
      openConfirm('Delete your account?', 'This will permanently remove your profile, complaint history, and preferences. This cannot be undone.', 'Delete Account', true, function () {
        // No backend in this isolated build — dummy confirm only.
      });
      return;
    }

    /* ---- Appearance: theme card ---- */
    var themeCard = e.target.closest('[data-theme-key]');
    if (themeCard) {
      state.theme = themeCard.getAttribute('data-theme-key');
      renderActivePanel();
      return;
    }

    /* ---- Appearance: accent swatch ---- */
    var swatch = e.target.closest('[data-accent-key]');
    if (swatch) {
      state.accent = swatch.getAttribute('data-accent-key');
      renderActivePanel();
      return;
    }

    /* ---- Appearance: font size chip ---- */
    var fontChip = e.target.closest('[data-font-key]');
    if (fontChip) {
      state.fontSize = fontChip.getAttribute('data-font-key');
      renderActivePanel();
      return;
    }

    /* ---- Help links (out of scope destinations — no-op) ---- */
    if (e.target.closest('.ce-help-link-btn')) {
      // Each of these opens its own page in the full product;
      // out of scope for this isolated Settings build.
      return;
    }
  });

  /* General form submit (dummy save) */
  panelEl.addEventListener('submit', function (e) {
    var form = e.target.closest('#ce-general-form');
    if (!form) return;
    e.preventDefault();

    var saveBtn = document.getElementById('ce-save-general-btn');
    var statusEl = document.getElementById('ce-save-status');
    var originalLabel = saveBtn.textContent;

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    window.setTimeout(function () {
      state.general.fullName = document.getElementById('f-fullname').value;
      state.general.email = document.getElementById('f-email').value;
      state.general.phone = document.getElementById('f-phone').value;
      state.general.language = document.getElementById('f-language').value;
      state.general.city = document.getElementById('f-city').value;
      state.general.state = document.getElementById('f-state').value;

      saveBtn.disabled = false;
      saveBtn.textContent = originalLabel;
      if (statusEl) {
        statusEl.style.opacity = '1';
        window.setTimeout(function () { statusEl.style.opacity = '0'; }, 2200);
      }
    }, 700);
  });

  /* Privacy: profile visibility select */
  panelEl.addEventListener('change', function (e) {
    if (e.target.id === 'p-visibility') {
      state.profileVisibility = e.target.value;
    }
  });

  /* ----------------------------------------------------------
     13. BACK BUTTON
  ---------------------------------------------------------- */
  backBtn.addEventListener('click', function () {
    CivicEyeShell.navigate('civiceye-profile.html');
  });

  /* ----------------------------------------------------------
     14. INITIAL LOAD SEQUENCE (simulated fetch)
  ---------------------------------------------------------- */
  renderNav();
  renderPanelSkeleton();

  window.setTimeout(function () {
    renderActivePanel();
  }, 650);

  window.setTimeout(function () {
    completionBar.style.transition = 'width 900ms cubic-bezier(0.16,1,0.3,1)';
    completionBar.style.width = '82%';
  }, 300);

})();
</script>
</body>
</html>
